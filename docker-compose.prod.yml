services:
  backend:
    image: ictapoc-backend:prod
    build:
      context: .
      dockerfile: ./docker/prod/backend/Dockerfile
    entrypoint: ["/app/entry.sh"]
    command: gunicorn -c gunicorn_config.py project.wsgi:application
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always
    networks:
      - intranet

  celery:
    image: ictapoc-backend:prod
    command: celery -A project worker --loglevel=${LOG_LEVEL:-info}
    volumes:
      - media_volume:/app/media
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A project inspect ping -d celery@$$HOSTNAME --timeout=10 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 5
    restart: always
    networks:
      - intranet

  frontend:
    build:
      context: .
      dockerfile: ./docker/prod/frontend/Dockerfile
    restart: always
    networks:
      - intranet

  nginx:
    build:
      context: .
      dockerfile: ./docker/prod/nginx/Dockerfile
    # Bind only to loopback; host Nginx is the sole public ingress.
    ports:
      - "127.0.0.1:8087:80"
    volumes:
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro # Required for X-Accel-Redirect PDF preview
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: always
    networks:
      - intranet

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - intranet

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - intranet

networks:
  intranet:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
  static_volume:
  media_volume:
