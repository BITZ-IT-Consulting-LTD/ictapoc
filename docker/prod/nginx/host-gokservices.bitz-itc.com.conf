# Host Nginx configuration for the GoK Repeatable Services Platform.
# Install as: /etc/nginx/sites-available/gokservices.bitz-itc.com.conf
# Prerequisite: a certificate issued for gokservices.bitz-itc.com.

upstream gokservices_poc {
    server 127.0.0.1:8087;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name gokservices.bitz-itc.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gokservices.bitz-itc.com;

    ssl_certificate /etc/letsencrypt/live/gokservices.bitz-itc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gokservices.bitz-itc.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:GOKServicesSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/gokservices.access.log;
    error_log /var/log/nginx/gokservices.error.log warn;

    client_max_body_size 100m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        proxy_pass http://gokservices_poc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
