name: Deploy production (EC2 via SSM)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write   # required for OIDC -> AWS role assumption
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy via SSM Run Command
        id: deploy
        run: |
          set -euo pipefail

          SCRIPT=$(cat <<'EOF'
          set -eu
          export HOME=/root
          git config --global --add safe.directory /opt/gokservices/app
          cd /opt/gokservices/app

          mkdir -p backups
          set -a
          . ./.env
          set +a
          docker compose -f docker-compose.prod.yml exec -T db \
            pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc \
            > "backups/gokservices-$(date +%Y%m%d-%H%M%S).dump"

          git fetch origin main
          git checkout main
          git reset --hard origin/main

          docker compose -f docker-compose.prod.yml build --pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          docker compose -f docker-compose.prod.yml ps

          for i in $(seq 1 10); do
            if curl -fsS https://gokservices.bitz-itc.com/ready; then
              echo "Deployment healthy."
              exit 0
            fi
            echo "Waiting for app to become ready ($i/10)..."
            sleep 6
          done

          echo "Health check failed after deploy" >&2
          exit 1
          EOF
          )

          # Build the SSM parameters as real JSON (one array element per line) so the
          # AWS CLI never has to parse quotes/newlines through its shorthand syntax.
          jq -n --arg script "$SCRIPT" \
            '{commands: ($script | split("\n"))}' \
            > /tmp/ssm-params.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${{ github.sha }} to gokservices production" \
            --timeout-seconds 1200 \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "Dispatched SSM command $COMMAND_ID"

      - name: Wait for SSM command to finish
        run: |
          set -euo pipefail
          aws ssm wait command-executed \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "Status" --output text)

          echo "Command status: $STATUS"

          aws ssm get-command-invocation \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "StandardOutputContent" --output text

          if [ "$STATUS" != "Success" ]; then
            echo "--- stderr ---"
            aws ssm get-command-invocation \
              --command-id "${{ steps.deploy.outputs.command_id }}" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "StandardErrorContent" --output text
            exit 1
          fi
